name: "Latest 'build' Tag Status"

on:
  push:
    tags: [ "build-*" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        netsdkver:
          - 8.0.x
          - 9.0.x
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout tag
      uses: actions/checkout@v4.2.2
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4.3.0
      with:
        dotnet-version: ${{ matrix.netsdkver }}
    - name: Restore dependencies
      run: dotnet restore --ucr
    - name: Build
      run: dotnet build --no-restore --configuration Release-R2R --ucr
    - name: Test
      run: dotnet test --no-restore --configuration Release-R2R --verbosity minimal
